name: CI

# 手动触发：构建 Armbian ZC-328 镜像。
# 当前适配 Armbian tag：v26.11.0-trunk.30。
# 编译产物以 release 形式发布：build-debs 构建的板级 deb + 各系统/类型变体的压缩镜像。
# 矩阵风格参考 armbian-onecloud：多系统（RELEASE）× 多类型（minimal/cli/xfce 桌面）并行构建。
# release 流程：prepare 只计算 release 名/tag；第一次上传附件的任务负责确保 release
# 存在（不存在则用 .github/release-body.md 重建，body 为纯描述信息，重建后不再改写）。
# 这样本就无附件的"空壳" release 不会提前暴露（易被误删），且运行期间 release 被删
# 也能在第一次上传时自愈，不会让构建几十分钟的任务白白失败。
# 不用 softprops：其 v3 先建草稿再发布，其他任务按 tag 查不到草稿会另建新 release，
# 且其重复草稿清理逻辑会删掉带正文的那个 release，导致描述信息丢失。
# release 名称格式：CI <armbian tag> <编译日期(UTC+0, 触发时刻)>
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to a GitHub release'
        type: boolean
        default: true

concurrency:
  group: armbian-zc328-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  ARMBIAN_TAG: v26.11.0-trunk.30
  # 镜像压缩率设为最大：xz 压缩比率最高档（0-9，9 为最大压缩率）
  IMAGE_XZ_COMPRESSION_RATIO: 9

jobs:
  # ---------------------------------------------------------------------------
  # prepare: 按触发时刻 UTC 单点计算 release 名/tag（跨天时所有任务保持一致）。
  #          不在此创建 release——空壳 release 暴露在外易被误删（r11 即被运行中删除）。
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release-name.outputs.release_name }}
      release_tag: ${{ steps.release-name.outputs.release_tag }}
    steps:
      - name: Compute release name/tag (CI <tag> <build date UTC, trigger time>)
        id: release-name
        run: |
          set -euo pipefail
          TAG="${{ env.ARMBIAN_TAG }}"
          # 触发时刻 UTC 日期（构建可能跨天，以启动时刻为准保持一致）
          DATE="$(date -u +%Y%m%d)"
          # release 显示名可含空格（用户格式要求）；git tag 不允许空格，故派生一个无空格的 tag
          echo "release_name=CI ${TAG} ${DATE}" >> "$GITHUB_OUTPUT"
          # 追加 run 序号保证每次触发 tag 唯一：同一天重复触发会复用同一日期，
          # 若 tag 相同会更新既有 release 并先删除同名旧资产，而刚上传的资产
          # 在 GitHub API 里删除常返回 404（最终一致性），导致上传步骤失败。
          # 每次 run 用全新 tag => 总是创建新 release，不覆盖旧资产，彻底规避该问题。
          echo "release_tag=CI-${TAG}-${DATE}-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Release name: CI ${TAG} ${DATE}"
          echo "Release tag:  CI-${TAG}-${DATE}-r${{ github.run_number }}"

  # ---------------------------------------------------------------------------
  # build-debs: 构建板级 kernel/DTB/headers debs（与目标系统无关，供所有镜像变体复用），
  #             并作为附件追加到 release 上（不改写 body）
  # ---------------------------------------------------------------------------
  build-debs:
    name: Build debs current
    runs-on: ubuntu-latest
    timeout-minutes: 600
    needs: [ prepare ]
    steps:
      - name: Checkout this repo (board patches)
        uses: actions/checkout@v7

      - name: Checkout Armbian build repo at fixed tag
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "${{ env.ARMBIAN_TAG }}" https://github.com/armbian/build.git armbian
          test -f armbian/compile.sh

      - name: Apply this repo's patches into Armbian build tree
        run: |
          set -euo pipefail
          PROJ="$GITHUB_WORKSPACE"
          BUILD="$GITHUB_WORKSPACE/armbian"
          mkdir -p "$BUILD/config/boards" "$BUILD/config/kernel" "$BUILD/config/sources/families" \
                   "$BUILD/userpatches/extensions" \
                   "$BUILD/userpatches/kernel/archive/rockchip-6.18" "$BUILD/userpatches/u-boot/v2026.04"
          cp "$PROJ/config/boards/zc-328.conf"                          "$BUILD/config/boards/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config"        "$BUILD/config/kernel/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config.defconfig" "$BUILD/config/kernel/"
          cp "$PROJ/config/sources/families/rockchip.conf"              "$BUILD/config/sources/families/"
          cp "$PROJ"/userpatches/kernel/archive/rockchip-6.18/*.patch   "$BUILD/userpatches/kernel/archive/rockchip-6.18/"
          cp "$PROJ"/userpatches/u-boot/v2026.04/*.patch                "$BUILD/userpatches/u-boot/v2026.04/"
          # 保证 LF 行尾（Windows 检出可能是 CRLF）
          find "$BUILD/config" "$BUILD/userpatches" \
            \( -name '*.conf' -o -name '*.patch' -o -name '*.defconfig' \) \
            -exec sed -i 's/\r$//' {} \;
          # sanity: zc-328 块必须存在于 rockchip.conf
          grep -q 'BOARD" == "zc-328"' "$BUILD/config/sources/families/rockchip.conf"

      - name: Build kernel debs (inside Armbian docker)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/armbian"
          # GITHUB_ACTIONS=false 避免框架因 CI 环境改变远程缓存行为
          # 用 'kernel' artifact 命令编 debs：kernel 是交叉编译，无需 binfmt/chroot，
          # 也不走镜像构建的交互式 desktop/minimal 询问。'build' 会触发 NEEDS_BINFMT
          # （armhf rootfs 需 qemu binfmt），在未预配 binfmt 的 runner 上会失败。
          GITHUB_ACTIONS=false ./compile.sh kernel \
            BOARD=zc-328 \
            BRANCH=current \
            KERNEL_CONFIGURE=no \
            KERNEL_GIT=shallow \
            RELEASE=noble
          sudo chown $(id -u):$(id -g) -R output/ || true

      - name: Upload debs artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-current
          path: |
            armbian/output/debs/*.deb
            armbian/output/debs/**/*.deb
          if-no-files-found: error

      - name: Upload debs to release
        if: ${{ inputs.upload_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 展平到单一目录再上传，避免 *.deb 与 **/*.deb 通配符重叠导致同名资产重复上传
          mkdir -p armbian/output/debs-release
          find armbian/output/debs -name '*.deb' -exec cp {} armbian/output/debs-release/ \;
          shopt -s nullglob
          debs=(armbian/output/debs-release/*.deb)
          [[ ${#debs[@]} -gt 0 ]] || { echo "No debs to upload"; exit 1; }
          # 确保.release 存在（运行中被删则用仓库里的纯描述 body 重建），再只追加附件
          ensure-release() {
            gh release view "$1" >/dev/null 2>&1 && return 0
            echo "Release $1 missing, re-creating from .github/release-body.md ..."
            gh release create "$1" \
              --title "${{ needs.prepare.outputs.release_name }}" \
              --notes-file .github/release-body.md \
              --target "$GITHUB_SHA"
          }
          ensure-release "${{ needs.prepare.outputs.release_tag }}"
          gh release upload "${{ needs.prepare.outputs.release_tag }}" --clobber "${debs[@]}"

  # ---------------------------------------------------------------------------
  # build: 镜像矩阵（RELEASE × TYPE），参考 armbian-onecloud：
  #   minimal => BUILD_MINIMAL=yes；cli => 两者皆 no；desktop => BUILD_DESKTOP=yes + xfce
  # 各变体镜像文件名天然不同（armbian 会在文件名附加 _minimal / _<桌面环境>），
  # 并行构建，互不干扰；各自把镜像 + 校验和作为附件追加到 release（不改写 body）。
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.RELEASE }}-${{ matrix.TYPE == 'desktop' && matrix.DESKTOP_ENVIRONMENT || matrix.TYPE }}
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-latest
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        RELEASE:
          # 以下为 armbian v26.11 支持的发行版，按需取消注释
          # - focal # Ubuntu 20.04 LTS（已 EOL）
          # - jammy # Ubuntu 22.04 LTS
          - noble # Ubuntu 24.04 LTS
          # - questing # Ubuntu 25.10
          - resolute # Ubuntu 26.04 LTS
          # - buster # Debian 10
          # - bullseye # Debian 11
          - bookworm # Debian 12
          - trixie # Debian 13
          # - forky # Debian 14（testing）
          # - sid # Debian unstable
        TYPE:
          - minimal
          - cli
          - desktop
        include:
          - TYPE: desktop
            DESKTOP_ENVIRONMENT: xfce

    steps:
      - name: Checkout this repo (board patches)
        uses: actions/checkout@v7

      - name: Checkout Armbian build repo at fixed tag
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "${{ env.ARMBIAN_TAG }}" https://github.com/armbian/build.git armbian
          test -f armbian/compile.sh

      - name: Apply this repo's patches into Armbian build tree
        run: |
          set -euo pipefail
          PROJ="$GITHUB_WORKSPACE"
          BUILD="$GITHUB_WORKSPACE/armbian"
          mkdir -p "$BUILD/config/boards" "$BUILD/config/kernel" "$BUILD/config/sources/families" \
                   "$BUILD/userpatches/extensions" \
                   "$BUILD/userpatches/kernel/archive/rockchip-6.18" "$BUILD/userpatches/u-boot/v2026.04"
          cp "$PROJ/config/boards/zc-328.conf"                          "$BUILD/config/boards/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config"        "$BUILD/config/kernel/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config.defconfig" "$BUILD/config/kernel/"
          cp "$PROJ/config/sources/families/rockchip.conf"              "$BUILD/config/sources/families/"
          cp "$PROJ"/userpatches/kernel/archive/rockchip-6.18/*.patch   "$BUILD/userpatches/kernel/archive/rockchip-6.18/"
          cp "$PROJ"/userpatches/u-boot/v2026.04/*.patch                "$BUILD/userpatches/u-boot/v2026.04/"
          # 保证 LF 行尾（Windows 检出可能是 CRLF）
          find "$BUILD/config" "$BUILD/userpatches" \
            \( -name '*.conf' -o -name '*.patch' -o -name '*.defconfig' \) \
            -exec sed -i 's/\r$//' {} \;
          # sanity: zc-328 块必须存在于 rockchip.conf
          grep -q 'BOARD" == "zc-328"' "$BUILD/config/sources/families/rockchip.conf"

      # rk3288 是 armhf，镜像构建需在 chroot 里跑 armhf 二进制，依赖宿主 qemu binfmt。
      # setup-qemu-action 在 runner 宿主注册 binfmt_misc，armbian 容器（共享宿主内核）内才能通过
      # update-binfmts/arch-test 检查。
      - name: Set up QEMU (armhf binfmt for runner host)
        uses: docker/setup-qemu-action@v4

      - name: Download debs
        uses: actions/download-artifact@v8
        with:
          name: debs-current
          path: armbian/output/debs/

      - name: Build image (inside Armbian docker)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/armbian"
          # 用 'build' 而非 'docker' 子命令：armbian-next 在 GitHub runner 上会自动
          # 检测 Docker 并容器化构建；显式 'docker' 子命令在容器内会报 "asking for docker inside docker"。
          # DESKTOP_TIER：armbian v26.11 起桌面软件包按档位选择（minimal/mid/full），
          # 不传会在 CI 中弹交互式 "Choose desktop tier" 对话框导致构建失败
          # （mid = 浏览器/文件管理器/媒体应用 ~1GB，即框架默认档位）；
          # 旧的 DESKTOP_ENVIRONMENT_CONFIG_NAME / DESKTOP_APPGROUPS_SELECTED 已废弃。
          GITHUB_ACTIONS=false ./compile.sh build \
            BOARD=zc-328 \
            BRANCH=current \
            RELEASE=${{ matrix.RELEASE }} \
            BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
            BUILD_DESKTOP=${{ matrix.TYPE == 'desktop' && 'yes' || 'no' }} \
            DESKTOP_ENVIRONMENT=${{ matrix.DESKTOP_ENVIRONMENT }} \
            DESKTOP_TIER=mid \
            KERNEL_CONFIGURE=no \
            KERNEL_GIT=shallow \
            EXPERT=yes \
            COMPRESS_OUTPUTIMAGE=xz,sha
          sudo chown $(id -u):$(id -g) -R output/ || true

      - name: Collect artifacts
        id: artifacts
        run: |
          set -euo pipefail
          IMGDIR="$GITHUB_WORKSPACE/armbian/output/images"
          ls -la "$IMGDIR"
          # 压缩后产物为 .img.xz（失败时回退未压缩 .img）
          IMG="$(ls "$IMGDIR"/*.img.xz 2>/dev/null | head -1)"
          [[ -n "$IMG" ]] || IMG="$(ls "$IMGDIR"/*.img 2>/dev/null | head -1)"
          [[ -n "$IMG" ]] || { echo "No image found in $IMGDIR"; exit 1; }
          echo "img=$(basename "$IMG")" >> "$GITHUB_OUTPUT"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.RELEASE }}-${{ matrix.TYPE == 'desktop' && matrix.DESKTOP_ENVIRONMENT || matrix.TYPE }}
          path: armbian/output/images/*

      - name: Upload to release
        if: ${{ inputs.upload_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/armbian/output/images"
          # 镜像 + 校验和；armbian 生成的是 <镜像>.img.xz.sha，须包含 *.sha 才能匹配到。
          # 确保 release 存在（运行中被删则重建，同 build-debs），再只追加附件不改写 body。
          # 并行矩阵任务同时重建时可能撞 422 already_exists，失败后重查一次即可
          ensure-release() {
            gh release view "$1" >/dev/null 2>&1 && return 0
            echo "Release $1 missing, re-creating from .github/release-body.md ..."
            gh release create "$1" \
              --title "${{ needs.prepare.outputs.release_name }}" \
              --notes-file .github/release-body.md \
              --target "$GITHUB_SHA" && return 0
            gh release view "$1" >/dev/null 2>&1
          }
          ensure-release "${{ needs.prepare.outputs.release_tag }}"
          shopt -s nullglob
          files=(*.img.xz *.img *.sha)
          [[ ${#files[@]} -gt 0 ]] || { echo "No image files to upload"; exit 1; }
          gh release upload "${{ needs.prepare.outputs.release_tag }}" --clobber "${files[@]}"
