name: CI

# 手动触发：构建 Armbian ZC-328 镜像。
# 当前适配 Armbian tag：v26.11.0-trunk.30。
# 编译产物（压缩镜像 + 校验和 + build-debs 构建的板级 deb）以 release 形式发布；
# 镜像构建 job 不再重复上传 deb（此前 deb 重复上传同名资产导致 release API 404）。
# release 名称格式：CI <armbian tag> <编译日期(UTC+0, 触发时刻)>
on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to a GitHub release'
        type: boolean
        default: true

concurrency:
  group: armbian-zc328-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  ARMBIAN_TAG: v26.11.0-trunk.30
  # 镜像压缩率设为最大：xz 压缩比率最高档（0-9，9 为最大压缩率）
  IMAGE_XZ_COMPRESSION_RATIO: 9

jobs:
  # ---------------------------------------------------------------------------
  # prepare: 按触发时刻 UTC 生成 release 名
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release-name.outputs.release_name }}
      release_tag: ${{ steps.release-name.outputs.release_tag }}
    steps:
      - name: Compute release name/tag (CI <tag> <build date UTC, trigger time>)
        id: release-name
        run: |
          set -euo pipefail
          TAG="${{ env.ARMBIAN_TAG }}"
          # 触发时刻 UTC 日期（构建可能跨天，以启动时刻为准保持一致）
          DATE="$(date -u +%Y%m%d)"
          # release 显示名可含空格（用户格式要求）；git tag 不允许空格，故派生一个无空格的 tag
          echo "release_name=CI ${TAG} ${DATE}" >> "$GITHUB_OUTPUT"
          # 追加 run 序号保证每次触发 tag 唯一：同一天重复触发会复用同一日期，
          # 若 tag 相同 softprops 会更新既有 release 并先删除同名旧资产，而刚上传的资产
          # 在 GitHub API 里删除常返回 404（最终一致性），导致上传步骤失败。
          # 每次 run 用全新 tag => 总是创建新 release，不覆盖旧资产，彻底规避该问题。
          echo "release_tag=CI-${TAG}-${DATE}-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Release name: CI ${TAG} ${DATE}"
          echo "Release tag:  CI-${TAG}-${DATE}-r${{ github.run_number }}"

  # ---------------------------------------------------------------------------
  # build-debs: 构建板级 kernel/DTB/U-Boot debs，供 build job 复用
  # ---------------------------------------------------------------------------
  build-debs:
    name: Build debs current
    runs-on: ubuntu-latest
    timeout-minutes: 600
    needs: [ prepare ]
    steps:
      - name: Checkout this repo (board patches)
        uses: actions/checkout@v7

      - name: Checkout Armbian build repo at fixed tag
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "${{ env.ARMBIAN_TAG }}" https://github.com/armbian/build.git armbian
          test -f armbian/compile.sh

      - name: Apply this repo's patches into Armbian build tree
        run: |
          set -euo pipefail
          PROJ="$GITHUB_WORKSPACE"
          BUILD="$GITHUB_WORKSPACE/armbian"
          mkdir -p "$BUILD/config/boards" "$BUILD/config/kernel" "$BUILD/config/sources/families" \
                   "$BUILD/userpatches/extensions" \
                   "$BUILD/userpatches/kernel/archive/rockchip-6.18" "$BUILD/userpatches/u-boot/v2026.04"
          cp "$PROJ/config/boards/zc-328.conf"                          "$BUILD/config/boards/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config"        "$BUILD/config/kernel/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config.defconfig" "$BUILD/config/kernel/"
          cp "$PROJ/config/sources/families/rockchip.conf"              "$BUILD/config/sources/families/"
          cp "$PROJ"/userpatches/kernel/archive/rockchip-6.18/*.patch   "$BUILD/userpatches/kernel/archive/rockchip-6.18/"
          cp "$PROJ"/userpatches/u-boot/v2026.04/*.patch                "$BUILD/userpatches/u-boot/v2026.04/"
          # 保证 LF 行尾（Windows 检出可能是 CRLF）
          find "$BUILD/config" "$BUILD/userpatches" \
            \( -name '*.conf' -o -name '*.patch' -o -name '*.defconfig' \) \
            -exec sed -i 's/\r$//' {} \;
          # sanity: zc-328 块必须存在于 rockchip.conf
          grep -q 'BOARD" == "zc-328"' "$BUILD/config/sources/families/rockchip.conf"

      - name: Build kernel debs (inside Armbian docker)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/armbian"
          # GITHUB_ACTIONS=false 避免框架因 CI 环境改变远程缓存行为
          # 用 'kernel' artifact 命令编 debs：kernel 是交叉编译，无需 binfmt/chroot，
          # 也不走镜像构建的交互式 desktop/minimal 询问。'build' 会触发 NEEDS_BINFMT
          # （armhf rootfs 需 qemu binfmt），在未预配 binfmt 的 runner 上会失败。
          GITHUB_ACTIONS=false ./compile.sh kernel \
            BOARD=zc-328 \
            BRANCH=current \
            KERNEL_CONFIGURE=no \
            KERNEL_GIT=shallow \
            RELEASE=noble
          sudo chown $(id -u):$(id -g) -R output/ || true

      - name: Upload debs artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-current
          path: |
            armbian/output/debs/*.deb
            armbian/output/debs/**/*.deb
          if-no-files-found: error

      # 板级 deb 挂到 release：本 job 先于 build job 结束，负责创建 release 并附带 deb，
      # build job 稍后向同一 release 追加镜像并更新 body。
      - name: Stage debs for release
        if: ${{ inputs.upload_release }}
        run: |
          set -euo pipefail
          mkdir -p armbian/output/debs-release
          # 展平到单一目录，仅用一个不含 ** 的通配符上传，避免同名资产重复上传触发 404
          find armbian/output/debs -name '*.deb' -exec cp {} armbian/output/debs-release/ \;
          ls -la armbian/output/debs-release/

      - name: Upload debs to release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: |
            ZC-328 板级 deb 软件包（内核 / DTB / U-Boot / headers）。
            完整镜像（.img.xz + sha256）由 Build image job 稍后追加到本 release。
          files: armbian/output/debs-release/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: false

  # ---------------------------------------------------------------------------
  # build: 完整镜像（按 README 基线参数），仅镜像产物上传 release
  # （板级 deb 已由 build-debs job 上传至 release，此处不再重复上传）
  # ---------------------------------------------------------------------------
  build:
    name: Build image (noble/current)
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout this repo (board patches)
        uses: actions/checkout@v7

      - name: Checkout Armbian build repo at fixed tag
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "${{ env.ARMBIAN_TAG }}" https://github.com/armbian/build.git armbian
          test -f armbian/compile.sh

      - name: Apply this repo's patches into Armbian build tree
        run: |
          set -euo pipefail
          PROJ="$GITHUB_WORKSPACE"
          BUILD="$GITHUB_WORKSPACE/armbian"
          mkdir -p "$BUILD/config/boards" "$BUILD/config/kernel" "$BUILD/config/sources/families" \
                   "$BUILD/userpatches/extensions" \
                   "$BUILD/userpatches/kernel/archive/rockchip-6.18" "$BUILD/userpatches/u-boot/v2026.04"
          cp "$PROJ/config/boards/zc-328.conf"                          "$BUILD/config/boards/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config"        "$BUILD/config/kernel/"
          cp "$PROJ/config/kernel/linux-rockchip-current.config.defconfig" "$BUILD/config/kernel/"
          cp "$PROJ/config/sources/families/rockchip.conf"              "$BUILD/config/sources/families/"
          cp "$PROJ"/userpatches/kernel/archive/rockchip-6.18/*.patch   "$BUILD/userpatches/kernel/archive/rockchip-6.18/"
          cp "$PROJ"/userpatches/u-boot/v2026.04/*.patch                "$BUILD/userpatches/u-boot/v2026.04/"
          # 保证 LF 行尾（Windows 检出可能是 CRLF）
          find "$BUILD/config" "$BUILD/userpatches" \
            \( -name '*.conf' -o -name '*.patch' -o -name '*.defconfig' \) \
            -exec sed -i 's/\r$//' {} \;
          # sanity: zc-328 块必须存在于 rockchip.conf
          grep -q 'BOARD" == "zc-328"' "$BUILD/config/sources/families/rockchip.conf"

      # rk3288 是 armhf，镜像构建需在 chroot 里跑 armhf 二进制，依赖宿主 qemu binfmt。
      # setup-qemu-action 在 runner 宿主注册 binfmt_misc，armbian 容器（共享宿主内核）内才能通过
      # update-binfmts/arch-test 检查。
      - name: Set up QEMU (armhf binfmt for runner host)
        uses: docker/setup-qemu-action@v4

      - name: Download debs
        uses: actions/download-artifact@v8
        with:
          name: debs-current
          path: armbian/output/debs/

      - name: Build image (inside Armbian docker)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/armbian"
          # README 基线参数（BOARD=zc-328 / BRANCH=current / RELEASE=noble / 无桌面 / 非 minimal）
          # 用 'build' 而非 'docker' 子命令：armbian-next 在 GitHub runner 上会自动
          # 检测 Docker 并容器化构建；显式 'docker' 子命令在容器内会报 "asking for docker inside docker"。
          GITHUB_ACTIONS=false ./compile.sh build \
            BOARD=zc-328 \
            BRANCH=current \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            KERNEL_GIT=shallow \
            RELEASE=noble \
            COMPRESS_OUTPUTIMAGE=xz,sha
          sudo chown $(id -u):$(id -g) -R output/ || true

      - name: Collect artifacts
        id: artifacts
        run: |
          set -euo pipefail
          IMGDIR="$GITHUB_WORKSPACE/armbian/output/images"
          ls -la "$IMGDIR"
          # 压缩后产物为 .img.xz（失败时回退未压缩 .img）
          IMG="$(ls "$IMGDIR"/*.img.xz 2>/dev/null | head -1)"
          [[ -n "$IMG" ]] || IMG="$(ls "$IMGDIR"/*.img 2>/dev/null | head -1)"
          [[ -n "$IMG" ]] || { echo "No image found in $IMGDIR"; exit 1; }
          echo "img=$(basename "$IMG")" >> "$GITHUB_OUTPUT"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: image-current
          path: armbian/output/images/*

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG="${{ env.ARMBIAN_TAG }}"
          DATE="$(date -u +'%Y-%m-%d %H:%M:%S') UTC"

          ROOT="$GITHUB_WORKSPACE/armbian/output"
          # 收集镜像文件到表格行（文件名 + 人类可读大小）
          rows=""
          for f in "$ROOT"/images/*.img*; do
            [[ -f "$f" ]] || continue
            name="$(basename "$f")"
            bytes="$(stat -c %s "$f")"
            if   (( bytes >= 1073741824 )); then size="$(awk "BEGIN{printf \"%.1f GiB\", $bytes/1073741824}")"
            elif (( bytes >= 1048576 ));     then size="$(awk "BEGIN{printf \"%.1f MiB\", $bytes/1048576}")"
            else                                  size="$(awk "BEGIN{printf \"%.1f KiB\", $bytes/1024}")"
            fi
            rows+="| ${name} | ${size} |"$'\n'
          done

          cat > "$GITHUB_WORKSPACE/release-notes.md" <<EOF
          ## ZC-328 Armbian 镜像

          - **Armbian tag**: ${TAG}
          - **编译时间**: ${DATE}
          - **Board**: ZC-328 (Rockchip RK3288)
          - **Branch**: current
          - **Release**: noble (Ubuntu 24.04 LTS)
          - **压缩**: xz（IMAGE_XZ_COMPRESSION_RATIO=9）
          - **deb 软件包**: 板级内核 / DTB / U-Boot / headers 包已随本 release 附带（由 Build debs job 上传）

          ## 镜像文件

          | 文件 | 大小 |
          | --- | --- |
          ${rows}
          
          ## 默认登录账号

          Armbian 镜像默认凭据：

          - **用户名**: root
          - **密码**: 1234

          > 首次登录会强制要求设置新密码。建议同时创建普通用户并 apt-mark hold 板级内核/U-Boot 包，避免升级被普通源覆盖（详见仓库 README）。
          EOF

      - name: Upload to release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: ${{ github.workspace }}/release-notes.md
          # 仅上传镜像与校验和；deb 包已由 build-debs job 上传，不再重复上传
          # （此前 deb 的两个通配符重叠导致同名资产上传两次，release API 报 404 使 job 失败）
          files: |
            armbian/output/images/*.img.xz
            armbian/output/images/*.img
            armbian/output/images/*.sha256*
          fail_on_unmatched_files: false
          generate_release_notes: false
